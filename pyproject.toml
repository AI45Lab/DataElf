[project]
name = "dataelf"
version = "0.1.0"
description = "DataElf M1 insight discovery runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2",
  "langgraph>=1",
  "pyyaml>=6",
  "rdflib>=7",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27,<1"]
trajectory = [
  "wt-data-platform-sdk @ git+https://github.com/AI45Lab/wt-data-platform-sdk.git@e831c14fc6c45f78362fa3088973419ba651fabe",
]

[project.scripts]
dataelf = "dataelf.cli:app"
dataelf-serve = "dataelf_server.__main__:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dataelf*"]

[tool.setuptools.package-data]
dataelf = [
  "domains/**/*.yaml",
  "domains/ai_index/modeling/ontology/config.yaml.example",
  "domains/**/templates/**/*.json",
  "domains/*/pi/skills/**/*.md",
  "domains/trajectory_analysis/requirements-wt.txt",
  "domains/ai_index/modeling/ontology/stage1/runtime/*.ts",
  "domains/ai_index/modeling/ontology/stage1/schemas/*.json",
]

dataelf_server = ["ontology/templates/**/*.json", "prompts/*.md", "runtime/*.ts", "deployment/*"]

[tool.setuptools.exclude-package-data]
dataelf = ["domains/ai_index/modeling/ontology/config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
