# Copy to a private file and fill empty fields; see docs/configuration_examples.md.
runtime:
  enable_sqlite: false
explorer:
  type: pi
  pi:
    binary: null
    cwd: .
    model: ""
    mode: json
    timeout_seconds: 3600
    log_mode: summary
domains:
  ai_index:
    source:
      mode: api
      base_url: ""
      api_key: ""
ontology:
  enabled: false
  ontology_config: dataelf/ontology/config.yaml
env:
  PI_CODING_AGENT_DIR: .pi/agent
server:
  host: 127.0.0.1
  port: 8000
  max_pending_jobs: 50
  max_concurrent_jobs: 5
  state_dir: null
  intent:
    model_name: ""
    base_url: ""
    api_key: ""
    timeout_seconds: 90
    max_attempts: 3
    retry_backoff_seconds: 0.5
  source:
    max_pages: 50
  pi:
    execution_policy: bounded
    tool_protocol: model_compat
    transport: inherit
    protocol_repair_attempts: 2
