domain: ai_index
version: "1"
display_name: AI 科技情报
plugin: dataelf.domains.ai_index.plugin:create_plugin
capabilities:
  - dynamic_data_access
  - ontology_modeling
  - external_search
workspace_dirs:
  - raw/ai_index
  - raw/web
  - deep_dives
  - insights

# AI Index-specific ontology hints. These are consumed only inside this domain.
entities:
  Paper:
    table: papers
    id_field: paper_id
    name_field: title
  Institution:
    table: institutions
    id_field: institution_id
    name_field: name
  Scholar:
    table: scholars
    id_field: scholar_id
    name_field: display_name
  FundingEvent:
    table: funding
    id_field: funding_id
    name_field: title

relations:
  Paper.AUTHORED_BY.Scholar:
    table: paper_author
    source_field: paper_id
    target_field: scholar_id
  Paper.AFFILIATED_WITH.Institution:
    table: paper_institution
    source_field: paper_id
    target_field: institution_id
  Scholar.AFFILIATED_WITH.Institution:
    table: scholar_institution
    source_field: scholar_id
    target_field: institution_id
  Paper.YEARLY_METRIC:
    table: paper_yearly_counts
    source_field: paper_id
    target_field: year
  Scholar.YEARLY_METRIC:
    table: scholar_yearly_counts
    source_field: scholar_id
    target_field: year
  Institution.HAS_VENUE:
    table: institution_venues
    source_field: institution_id
    target_field: venue_name
  Scholar.HAS_VENUE:
    table: scholar_venues
    source_field: scholar_id
    target_field: venue_name
  Institution.HAS_FUNDING_ROUND:
    table: funding_rounds
    source_field: institution_id
    target_field: funding_id
