  batch_size: 128
  max_length: 512

deberta:
  model: /mnt/shared-storage-user/liwenjie1/evobox-share/data-assessor/scorers/models--nvidia--quality-classifier-deberta
  batch_size: 128
  max_length: 512

fineweb_edu:
  model: /mnt/shared-storage-user/liwenjie1/evobox-share/data-assessor/scorers/models--HuggingFaceFW--fineweb-edu-classifier
